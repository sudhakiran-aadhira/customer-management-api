[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-management-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
"fastapi",
"uvicorn[standard]",
"sqlalchemy",
"alembic",
"psycopg[binary]",
"pydantic-settings"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]